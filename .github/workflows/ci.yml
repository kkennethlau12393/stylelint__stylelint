name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  FORCE_COLOR: 2

permissions:
  contents: read

jobs:
  lint:
    uses: stylelint/.github/.github/workflows/call-lint.yml@ab7979355590956aa96d306dedfda6b2d42c4982 # 1.1.0
    permissions:
      contents: read

  test:
    uses: stylelint/.github/.github/workflows/call-test.yml@ab7979355590956aa96d306dedfda6b2d42c4982 # 1.1.0
    with:
      node-version: '["20", "22", "24", "26"]'
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      exclude: '[{"node-version": "24", "os": "ubuntu-latest"}]' # for coverage
    permissions:
      contents: read

  test-coverage:
    name: Test on Node.js 24 and ubuntu-latest with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install latest npm
        run: npm install --global npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test-coverage
        env:
          # https://nodejs.org/api/cli.html#--max-old-space-sizesize-in-megabytes
          NODE_OPTIONS: '--max-old-space-size=4096'
      # Abloh. It sits right after the step that runs your suite, so it measures the
      # tree your suite ran in and rebuilds nothing of yours. It puts that tree back
      # exactly as it found it, so the steps below still see what they always saw.
      # It installs its own CLI - and its own Node, if this runner's is older than 20.6 -
      # under RUNNER_TEMP, leaving your PATH alone.
      # The if: runs it even when an earlier step of yours failed, so it says so rather
      # than vanishing. It reports on this pull request and gates nothing until merge,
      # and it files none of that itself - the abloh-publish job below does, because
      # this job holds no permission to. Pinned to a commit; a tag can be moved.
      - name: Abloh
        if: ${{ !cancelled() }}
        uses: kkennethlau12393/abloh-action-census@0670a5209a76216037527047ddde24912d15d987
        with:
          # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run measures a build of the product
          # rather than the published CLI. Recorded in every row this workflow produced.
          cli-tarball: .abloh-census/engine/abloh-cli-0.1.4.tgz .abloh-census/engine/abloh-core-0.1.3.tgz .abloh-census/engine/abloh-engine-aster-0.1.0.tgz .abloh-census/engine/abloh-engine-v2-0.1.0.tgz .abloh-census/engine/abloh-measure-0.1.0.tgz .abloh-census/engine/abloh-replay-0.1.0.tgz .abloh-census/engine/abloh-sandbox-0.1.2.tgz .abloh-census/engine/abloh-source-analysis-0.1.0.tgz .abloh-census/engine/abloh-triage-0.1.2.tgz
          base: ${{ github.event.pull_request.base.sha }}
          job-status: ${{ job.status }}
          publish: attestation-job
      # ---------------------------------------------------------------------------------
      # ADDED BY THE ABLOH FIRST-CONTACT CENSUS, and these are the only lines of this file
      # that are not what `abloh init` wrote. It keeps the run's own artifact so the
      # census can classify from evidence rather than from this job's log. It runs after
      # everything Abloh does and cannot reach what was measured.
      # ---------------------------------------------------------------------------------
      - name: census - keep the run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abloh-census-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-evidence-manifest.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-run.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-results.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-summary.md
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-engine-v2-proofs.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-summary.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-preceding-refusal.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./.coverage/lcov.info
          fail_ci_if_error: true

      # This test is only enabled when the relevant environment variable is set,
      # so it is run here, separately from the main test matrix.
      - name: Run test for Yarn PnP
        run: |
          npm install --global corepack
          npm run test-node
        env:
          STYLELINT_TEST_YARN_PNP: 'true'
          YARN_ENABLE_HARDENED_MODE: 0 # https://yarnpkg.com/features/security#hardened-mode

      - name: Verify changeset
        # Skip fork PRs due to GitHub token permissions.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run changeset
          npm run lint:md
          git checkout -- CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ github.token }} # required by Changeset

  spellcheck:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install codespell
        run: pip install codespell

      - name: Spellcheck
        # Ignore a CI failure because there are false positives.
        run: codespell || echo 'Fix misspells via "codespell" on your console, or ignore false positives.'

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: stylelint/.github/.github/workflows/call-dependency-review.yml@ab7979355590956aa96d306dedfda6b2d42c4982 # 1.1.0
    permissions:
      contents: read
  # Abloh's publish job. It runs no code of yours, builds nothing and measures nothing:
  # it takes the report the Abloh step above left on this run and files it.
  #
  # It is a separate job because GitHub grants id-token: write to a whole JOB and
  # not to one step: putting it on the job above would hand the same identity to every
  # step that runs there, Abloh's and everybody else's. Here it reaches Abloh's step
  # and nothing else. It authorizes one thing, filing this report with Abloh, and
  # carries no write access to your repository. Declaring the block below takes no
  # grant away from anything, because this job is new and had none.
  abloh-publish:
    needs: test-coverage
    # Runs even when the job above failed - a trial that stopped is the report you need.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Abloh publish
        uses: kkennethlau12393/abloh-action-census/attest@0670a5209a76216037527047ddde24912d15d987
